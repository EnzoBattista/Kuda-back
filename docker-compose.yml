version: '3.8'

services:
  db:
    image: postgres:15
    container_name: gimnasio_kuda_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_clave
      POSTGRES_DB: gimnasio_kuda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: